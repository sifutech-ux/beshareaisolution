<body data-aurora="account"><main class="akaun"><p><a href="./">Kembali ke akaun</a></p><h1>Pulihkan kata laluan</h1>
<p>Akaun Business Copilot dan AI Marketing menggunakan kata laluan yang sama.</p>
<form class="kad" id="recovery"><label id="mail-label">E-mel akaun<input id="mail" type="email" autocomplete="email" maxlength="120" required></label>
<label id="new-label" hidden>Kata laluan baharu<input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72"></label>
<label id="confirm-label" hidden>Ulang kata laluan baharu<input id="confirmation" type="password" autocomplete="new-password" maxlength="72"></label>
<button type="submit" id="send">Hantar pautan pemulihan</button><p id="feedback" role="status"></p></form>
<p>Pengguna WhatsApp AI OS boleh <a href="../whatsapp/ruang.html#lupa">pulihkan akaun AI OS di sini</a>.</p></main>

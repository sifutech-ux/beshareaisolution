<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daftar atau masuk akaun BeShare AI Solution." />
    <title>Akaun — BeShare AI Solution</title>
    <link id="akaun-favicon" rel="icon" type="image/svg+xml" href="../assets/brand/aurora-v2/beshare-business-copilot-favicon.svg" />
    <link id="akaun-apple-icon" rel="apple-touch-icon" href="../assets/brand/aurora-v2/beshare-business-copilot-apple-touch-icon.png" />
    <link rel="stylesheet" href="../styles.css?v=20260930" />
    <link rel="stylesheet" href="akaun.css?v=20260930" />
    <link rel="stylesheet" href="../assets/aurora-app.css?v=20261125-1" />
    <link rel="stylesheet" href="../assets/brand.css?v=20261127-aurora-v2" />
  </head>
  <body data-aurora="account">
    <div class="bg-glow" aria-hidden="true"></div>
    <header class="nasihat-atas">
      <a id="akaun-jenama" class="brand bs-brand" href="../" aria-label="BeShare Business Copilot — laman utama" data-brand-surface="dark">
        <img id="akaun-logo-dark" class="bs-brand__logo bs-brand__logo--dark" src="../assets/brand/aurora-v2/beshare-business-copilot-logo-dark.svg" width="734" height="219" alt="" aria-hidden="true" />
        <img id="akaun-logo-light" class="bs-brand__logo bs-brand__logo--light" src="../assets/brand/aurora-v2/beshare-business-copilot-logo-light.svg" width="734" height="219" alt="" aria-hidden="true" />
      </a>
    </header>
    <main class="akaun">
      <p class="akaun__kembali"><a id="akaun-kembali" href="../">Gerbang</a></p>
      <h1 id="akaun-tajuk">Akaun Business Copilot</h1>
      <p id="akaun-penerangan" class="akaun__ayat">Masuk atau daftar untuk terus ke Business Copilot. Akaun ini juga boleh digunakan untuk BeShare AI Marketing.</p>

      <section id="sudah" class="kad" hidden>
        <p id="emel-semasa"></p>
        <a class="utama" id="akaun-destinasi" href="../penasihat/#utama">Buka Dashboard Business Copilot</a>
        <button type="button" id="keluar">Keluar</button>
      </section>

      <form id="borang" class="kad">
        <div class="mod" role="tablist">
          <button type="button" id="mod-masuk" class="hidup" role="tab">Masuk</button>
          <button type="button" id="mod-daftar" role="tab">Daftar</button>
        </div>
        <label>
          E-mel
          <input id="email" name="email" type="email" autocomplete="username" required maxlength="120" />
        </label>
        <label>
          Kata laluan
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="72" />
        </label>
        <a href="pulih.html">Lupa kata laluan?</a>
        <p id="ralat" class="ralat" hidden></p>
        <button type="submit" id="hantar">Masuk</button>
      </form>
    </main>
    <script src="../stor-draf.js?v=20261012d" defer></script>
    <script src="../akaun-asal.js?v=20261018vpsproduction" defer></script>
    <script src="kembali.js?v=20261117marketing1" defer></script>
    <script src="akaun.js?v=20261127-aurora-v2" defer></script>
  </body>
</html>

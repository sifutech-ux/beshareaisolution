name: Copilot saved outcomes
on:
  pull_request:
    paths:
      - 'copilot/**'
      - 'penasihat/**'
      - '.github/workflows/copilot-outcomes.yml'
permissions:
  contents: read
jobs:
  account-and-browser-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: copilot_kuota_test
          POSTGRES_USER: copilot_qa
          POSTGRES_PASSWORD: synthetic-copilot-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U copilot_qa -d copilot_kuota_test"
          --health-interval=3s --health-timeout=3s --health-retries=20
    steps:
      - name: Fetch exact proposed source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin https://github.com/sifutech-ux/beshareaisolution.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Account and media test dependencies
        shell: bash
        run: |
          python3 -m pip install psycopg2-binary cryptography -r marketing/requirements-media.txt
          # Keep Ubuntu's existing signing keys and sources; prefer its Azure mirror.
          grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          printf '%b' \
            'https://azure.archive.ubuntu.com/ubuntu/\tpriority:1\n' \
            'https://archive.ubuntu.com/ubuntu/\tpriority:2\n' \
            'https://security.ubuntu.com/ubuntu/\tpriority:3\n' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          apt_network=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          if ! sudo timeout --kill-after=10s 120s apt-get "${apt_network[@]}" update; then
            echo "::error::Ubuntu package index update failed or exceeded 120 seconds."
            exit 1
          fi
          # Bound downloads before dpkg starts; installation then requires cached packages.
          if ! sudo timeout --kill-after=10s 240s apt-get "${apt_network[@]}" install -y --no-install-recommends --download-only ffmpeg; then
            echo "::error::FFmpeg dependency download failed or exceeded 240 seconds."
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends --no-download ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Account regressions, isolation, concurrency and retries on SQLite and PostgreSQL
        env:
          PYTHONPATH: copilot/account
          COPILOT_TEST_POSTGRES: '1'
          COPILOT_TEST_DATABASE_URL: postgresql://copilot_qa:synthetic-copilot-ci-only@127.0.0.1:5432/copilot_kuota_test
        run: python3 -m unittest discover -s copilot/tests -p 'test_*.py' -v
      - name: Browser boundary helpers and syntax
        run: |
          node --test copilot/tests/hasil-core.test.js
          node --check penasihat/hasil.js
          node --check penasihat/bijak.js
          node --check penasihat/penasihat.js

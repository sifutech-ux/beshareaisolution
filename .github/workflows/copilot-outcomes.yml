name: Copilot saved outcomes
on:
  pull_request:
    paths:
      - 'copilot/**'
      - 'penasihat/**'
      - '.github/workflows/copilot-outcomes.yml'
permissions:
  contents: read
jobs:
  account-and-browser-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: copilot_kuota_test
          POSTGRES_USER: copilot_qa
          POSTGRES_PASSWORD: synthetic-copilot-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U copilot_qa -d copilot_kuota_test"
          --health-interval=3s --health-timeout=3s --health-retries=20
    steps:
      - name: Fetch exact proposed source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin https://github.com/sifutech-ux/beshareaisolution.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - run: python3 -m pip install psycopg2-binary
      - name: Account regressions, isolation, concurrency and retries on SQLite and PostgreSQL
        env:
          PYTHONPATH: copilot/account
          COPILOT_TEST_POSTGRES: '1'
          COPILOT_TEST_DATABASE_URL: postgresql://copilot_qa:synthetic-copilot-ci-only@127.0.0.1:5432/copilot_kuota_test
        run: python3 -m unittest discover -s copilot/tests -p 'test_*.py' -v
      - name: Browser boundary helpers and syntax
        run: |
          node --test copilot/tests/hasil-core.test.js
          node --check penasihat/hasil.js
          node --check penasihat/bijak.js
          node --check penasihat/penasihat.js

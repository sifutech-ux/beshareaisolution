<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk dashboard — BeShare AI Solution</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="landing.css">
</head>
<body>
    <div class="bg-glow" aria-hidden="true"></div>
    <main class="login">
        <form class="panel form" method="post" action="/masuk" onsubmit="event.preventDefault(); document.getElementById('nota').hidden = false;">
            <a class="brand" href="../" style="margin:0; text-decoration:none; color:inherit;">
                <span class="brand__name">BeShare<span class="brand__accent"> AI Solution</span></span>
            </a>
            <h1>Dashboard pelanggan</h1>
            <p class="muted">Gunakan nombor WhatsApp pada tempahan, dan kata laluan yang BeShare hantar selepas tempahan disahkan.</p>
            <p id="nota" hidden class="muted">Log masuk diproses oleh enjin WhatsApp. Alamat awam enjin belum disambung ke domain ini.</p>
            <label>Nombor WhatsApp
                <input name="phone" required>
            </label>
            <label>Kata laluan
                <input name="password" type="password" required>
            </label>
            <button class="btn" type="submit">Masuk meja saya</button>
            <a href="./">Kembali ke tempahan</a>
        </form>
    </main>
</body>
</html>
